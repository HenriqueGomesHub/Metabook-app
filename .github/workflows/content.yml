# Runs content jobs (tools/content/run-job.mjs) and commits what they produce back to the branch.
# Push one or more content/jobs/<name>.json to start them; each job file runs as its own parallel
# runner. Read content/jobs/<name>.result.json for the outcome.
name: content

on:
  push:
    branches-ignore:
      - main
    paths:
      - 'content/jobs/*.json'
      - '!content/jobs/*.result.json'
      # the review pack has its own workflow (review-pack.yml)
      - '!content/jobs/pack.json'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job file, e.g. content/jobs/clues-fetch.json'
        required: true

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.jobs.outputs.files }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Find job files
        id: jobs
        env:
          INPUT_JOB: ${{ github.event.inputs.job }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$INPUT_JOB" ]; then
            files="$INPUT_JOB"
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # new branch or force push: every job added or changed since the default branch
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || git rev-list --max-parents=0 HEAD | tail -1)
            files=$(git diff --name-only --diff-filter=AM "$base" HEAD -- 'content/jobs/*.json')
          else
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'content/jobs/*.json')
          fi
          files=$(printf '%s\n' $files | grep -v -e '\.result\.json$' -e '^content/jobs/pack\.json$' || true)
          json=$(printf '%s\n' $files | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>console.log(JSON.stringify(s.split(/\s+/).filter(Boolean))))")
          echo "files=$json" >> "$GITHUB_OUTPUT"
          echo "Jobs: $json"

  run:
    needs: plan
    if: needs.plan.outputs.files != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        file: ${{ fromJson(needs.plan.outputs.files) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Job name
        id: name
        env:
          JOB_FILE: ${{ matrix.file }}
        run: |
          name=$(node tools/content/run-job.mjs --name "$JOB_FILE")
          echo "name=$name" >> "$GITHUB_OUTPUT"
          # an old committed result must not stand in for this run's
          rm -f "content/jobs/$name.result.json"

      - run: npm ci

      - name: Run job
        id: run
        env:
          JOB_FILE: ${{ matrix.file }}
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        # run-job.mjs writes a result file even when it crashes, and then exits 0
        run: node tools/content/run-job.mjs "$JOB_FILE"

      - name: Validate content
        if: steps.run.outcome == 'success'
        continue-on-error: true
        run: npm run validate:content

      # commit even when a job crashed, so the result file (or partial output) is visible from outside Actions
      - name: Commit results
        if: always()
        env:
          NAME: ${{ steps.name.outputs.name }}
          BRANCH: ${{ github.ref_name }}
        run: |
          if [ -n "$NAME" ] && [ ! -f "content/jobs/$NAME.result.json" ]; then
            node -e "require('fs').writeFileSync('content/jobs/' + process.env.NAME + '.result.json', JSON.stringify({ name: process.env.NAME, fatal: 'runner failed before run-job wrote a result; see the Actions log' }, null, 2) + '\\n')"
          fi
          git config user.name "metabook-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "content: $NAME [skip ci]"
          # parallel runners push to the same branch: rebase and retry
          for attempt in 1 2 3 4 5 6 7 8; do
            git pull --rebase origin "$BRANCH" && git push origin "HEAD:$BRANCH" && exit 0
            git rebase --abort 2>/dev/null || true
            sleep $((attempt * 7))
          done
          exit 1
