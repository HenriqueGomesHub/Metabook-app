# Runs content jobs (tools/content/run-job.mjs) and commits what they produce back to the branch.
# Push a content/jobs/<name>.json to start one; read content/jobs/<name>.result.json for the outcome.
name: content

on:
  push:
    paths:
      - 'content/jobs/*.json'
      - '!content/jobs/*.result.json'
  workflow_dispatch:
    inputs:
      job:
        description: 'Job file, e.g. content/jobs/pl-test.json'
        required: true

permissions:
  contents: write

concurrency:
  group: content-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Find job files
        id: jobs
        env:
          INPUT_JOB: ${{ github.event.inputs.job }}
          BEFORE: ${{ github.event.before }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ -n "$INPUT_JOB" ]; then
            files="$INPUT_JOB"
          elif [ -z "$BEFORE" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            # new branch or force push: every job added or changed since the default branch
            base=$(git merge-base "origin/$DEFAULT_BRANCH" HEAD || git rev-list --max-parents=0 HEAD | tail -1)
            files=$(git diff --name-only --diff-filter=AM "$base" HEAD -- 'content/jobs/*.json')
          else
            files=$(git diff --name-only --diff-filter=AM "$BEFORE" HEAD -- 'content/jobs/*.json')
          fi
          files=$(printf '%s\n' $files | grep -v '\.result\.json$' || true)
          echo "files=$(echo $files)" >> "$GITHUB_OUTPUT"
          echo "Jobs: ${files:-none}"

      - name: Run jobs
        id: run
        if: steps.jobs.outputs.files != ''
        env:
          MAPILLARY_TOKEN: ${{ secrets.MAPILLARY_TOKEN }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          names=""
          for file in ${{ steps.jobs.outputs.files }}; do
            node tools/content/run-job.mjs "$file"
            names="$names $(node -p "JSON.parse(require('fs').readFileSync('$file','utf8')).name")"
          done
          echo "names=$(echo $names)" >> "$GITHUB_OUTPUT"

      # the result file already records validation; this step only flags it in the run list
      - name: Validate content
        if: steps.run.outcome == 'success'
        continue-on-error: true
        run: npm run validate:content

      - name: Commit results
        if: steps.run.outcome == 'success'
        env:
          NAMES: ${{ steps.run.outputs.names }}
          BRANCH: ${{ github.ref_name }}
        run: |
          git config user.name "metabook-content-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/
          if git diff --cached --quiet; then
            echo "Nothing to commit"
            exit 0
          fi
          git commit -m "content: $NAMES [skip ci]"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
