<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Metabook · Flags</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@400;500;600;700&amp;family=Stack+Sans+Text:wght@400;500;600&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
            background: #12110f;
          }
          a {
            color: #eeeae2;
          }
          a:hover {
            color: #ffffff;
          }
          .i {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
          }
          .chip {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            min-width: 44px;
            box-sizing: border-box;
            border-radius: 999px;
            background: #1a1916;
            border: 1px solid #2e2c27;
            color: #eeeae2;
            text-decoration: none;
          }
          .chip:hover {
            background: #22211d;
            color: #ffffff;
          }
          input::placeholder {
            color: #8a857b;
          }
          input:focus {
            outline: none;
            border-color: #a3c49a;
          }
          .cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 52px;
            padding: 0 28px;
            border-radius: 999px;
            background: #a3c49a;
            color: #12110f;
            font:
              600 16px 'Stack Sans Text',
              sans-serif;
            border: 0;
            cursor: pointer;
          }
          .cta:hover {
            background: #b4d3ab;
          }
          .ghost {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 52px;
            padding: 0 20px;
            border-radius: 999px;
            background: none;
            border: 1px solid #2e2c27;
            color: #eeeae2;
            font:
              500 15px 'Stack Sans Text',
              sans-serif;
            cursor: pointer;
          }
          .ghost:hover {
            background: #1a1916;
          }
          .link {
            background: none;
            border: 0;
            padding: 6px;
            color: #a39e92;
            font:
              400 13px 'Stack Sans Text',
              sans-serif;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
          }
          .link:hover {
            color: #eeeae2;
          }
          @keyframes rise {
            from {
              opacity: 0;
              transform: translateY(14px);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          @keyframes unfurl {
            from {
              opacity: 0;
              transform: scale(0.92) rotate(-1.5deg);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          .r {
            animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
          }
          .d1 {
            animation-delay: 0.1s;
          }
          .d2 {
            animation-delay: 0.2s;
          }
          .flag {
            animation: unfurl 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
          }
          .cta,
          .chip,
          .ghost,
          input {
            transition:
              background-color 0.2s ease,
              color 0.2s ease,
              border-color 0.2s ease,
              transform 0.2s ease;
          }
          .cta:active,
          .chip:active,
          .ghost:active {
            transform: scale(0.97);
          }
          @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
              animation: none !important;
              transition: none !important;
            }
          }
        </style>
      </helmet>
      <div
        style="
          position: relative;
          min-height: 900px;
          background: #12110f;
          color: #eeeae2;
          font-family: 'Stack Sans Text', system-ui, sans-serif;
          overflow: hidden;
        "
      >
        <svg
          aria-hidden="true"
          style="
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.08;
          "
        >
          <filter id="grain-flags">
            <feTurbulence
              type="fractalNoise"
              baseFrequency="0.85"
              numOctaves="2"
              stitchTiles="stitch"
            ></feTurbulence>
          </filter>
          <rect width="100%" height="100%" filter="url(#grain-flags)"></rect>
        </svg>

        <div
          class="r"
          style="
            position: relative;
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 28px 28px 0;
          "
        >
          <a class="chip" href="Main.dc.html" aria-label="Leave session"
            ><svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M6 6l12 12"></path>
              <path d="M18 6 6 18"></path></svg
          ></a>
          <div
            role="img"
            aria-label="Card 13 of 48"
            style="flex: 1; height: 3px; border-radius: 2px; background: #2e2c27"
          >
            <div style="width: 27%; height: 100%; border-radius: 2px; background: #eeeae2"></div>
          </div>
          <span style="font-size: 14px; color: #a39e92; font-variant-numeric: tabular-nums"
            >13 / 48</span
          >
        </div>

        <main
          style="
            position: relative;
            max-width: 640px;
            margin: 0 auto;
            padding: 96px 24px 96px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 48px;
            box-sizing: border-box;
          "
        >
          <figure
            style="margin: 0; display: flex; flex-direction: column; align-items: center; gap: 16px"
          >
            <svg
              class="flag"
              role="img"
              aria-label="Flag to identify"
              viewBox="0 0 5 3"
              style="
                width: min(400px, 80vw);
                height: auto;
                display: block;
                border-radius: 6px;
                outline: 1px solid rgba(238, 234, 226, 0.08);
              "
            >
              <rect width="5" height="1" fill="#FDB913"></rect>
              <rect y="1" width="5" height="1" fill="#006A44"></rect>
              <rect y="2" width="5" height="1" fill="#C1272D"></rect>
            </svg>
            <figcaption
              class="r d1"
              style="font-size: 12px; color: #8a857b; letter-spacing: 0.08em"
            >
              3 : 5
            </figcaption>
          </figure>

          <sc-if value="{{asking}}" hint-placeholder-val="{{ true }}">
            <form
              class="r d2"
              onSubmit="{{submit}}"
              style="width: 100%; display: flex; flex-direction: column; gap: 14px"
            >
              <label for="flag-answer" style="font-size: 14px; color: #a39e92; text-align: center"
                >Which country?</label
              >
              <div style="display: flex; gap: 10px">
                <input
                  id="flag-answer"
                  type="text"
                  placeholder="Type a country"
                  autocomplete="off"
                  value="{{text}}"
                  onChange="{{onType}}"
                  style="
                    flex: 1;
                    min-width: 0;
                    height: 56px;
                    padding: 0 22px;
                    border-radius: 999px;
                    background: #1a1916;
                    border: 1px solid #2e2c27;
                    color: #eeeae2;
                    font:
                      400 17px 'Stack Sans Text',
                      sans-serif;
                    box-sizing: border-box;
                  "
                />
                <button
                  type="submit"
                  class="cta"
                  aria-label="Check answer"
                  style="width: 56px; height: 56px; padding: 0"
                >
                  <svg
                    class="i"
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    aria-hidden="true"
                    style="stroke-width: 2"
                  >
                    <path d="M5 12h14"></path>
                    <path d="m13 6 6 6-6 6"></path>
                  </svg>
                </button>
              </div>
              <div
                style="
                  display: flex;
                  justify-content: center;
                  align-items: center;
                  gap: 12px;
                  font-size: 13px;
                  color: #8a857b;
                "
              >
                <span
                  ><kbd
                    style="
                      font:
                        500 12px 'Stack Sans Text',
                        sans-serif;
                      padding: 2px 7px;
                      border: 1px solid #3a3832;
                      border-radius: 6px;
                      color: #a39e92;
                    "
                    >Enter</kbd
                  >
                  to answer</span
                >
                <span aria-hidden="true">·</span>
                <button type="button" class="link" onClick="{{giveUp}}">I don’t know</button>
              </div>
            </form>
          </sc-if>

          <sc-if value="{{revealed}}" hint-placeholder-val="{{ false }}">
            <div
              class="r"
              style="
                width: 100%;
                display: flex;
                flex-direction: column;
                gap: 16px;
                align-items: stretch;
              "
            >
              <div style="text-align: center">
                <p style="margin: 0 0 6px; font-size: 14px; color: {{verdictColor}}">{{verdict}}</p>
                <h1
                  style="
                    margin: 0;
                    font-family: 'Stack Sans Headline', sans-serif;
                    font-size: 48px;
                    font-weight: 600;
                    letter-spacing: -0.03em;
                  "
                >
                  Lithuania
                </h1>
              </div>
              <div
                style="
                  border-radius: 18px;
                  padding: 20px 22px;
                  background: rgba(163, 196, 154, 0.08);
                  border: 1px solid rgba(163, 196, 154, 0.28);
                "
              >
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 10px;
                  "
                >
                  <span
                    style="
                      display: flex;
                      align-items: center;
                      gap: 8px;
                      font-size: 13px;
                      color: #a3c49a;
                    "
                    ><svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                      <circle cx="11" cy="11" r="6.5"></circle>
                      <path d="m16 16 4 4"></path></svg
                    >Remember</span
                  >
                  <span style="font-size: 12px; color: #a39e92; font-variant-numeric: tabular-nums"
                    >{{tipCount}}</span
                  >
                </div>
                <p style="margin: 0; font-size: 16px; line-height: 1.55">{{tip}}</p>
              </div>
              <div style="display: flex; gap: 10px; justify-content: center">
                <button class="cta" onClick="{{next}}">
                  Next<svg
                    class="i"
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    aria-hidden="true"
                    style="stroke-width: 2"
                  >
                    <path d="M5 12h14"></path>
                    <path d="m13 6 6 6-6 6"></path>
                  </svg>
                </button>
                <button class="ghost" onClick="{{more}}">Another tip</button>
              </div>
            </div>
          </sc-if>
        </main>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
      class Component extends DCLogic {
      state = { text: '', result: null, round: 0 };
      renderVals() {
      const tips = [
      'Yellow, green, red from top to bottom. Bolivia is red, yellow, green, and Ghana adds a black star.',
      'The Baltic set: Estonia blue-black-white, Latvia dark red-white-dark red, Lithuania yellow-green-red.',
      'In Street View, Lithuanian place names often end in -ai or -iai, like Trakai or Šiauliai.'
      ];
      const { text, result, round } = this.state;
      const n = tips.length;
      const idx = round % n;
      const revealed = result !== null;
      const check = (typed) => {
      const t = typed.trim().toLowerCase();
      const ok = t === 'lithuania' || t === 'lietuva';
      this.setState({ result: ok ? 'right' : (t === '' ? 'skip' : 'wrong') });
      };
      let verdict = 'Right';
      let verdictColor = '#A3C49A';
      if (result === 'wrong') { verdict = 'You typed ' + text.trim(); verdictColor = '#D9A35E'; }
      if (result === 'skip') { verdict = 'Now you know'; verdictColor = '#A39E92'; }
      return {
      text,
      asking: !revealed,
      revealed,
      verdict,
      verdictColor,
      tip: tips[idx],
      tipCount: 'Tip ' + (idx + 1) + ' of ' + n,
      onType: (e) => this.setState({ text: e.target.value }),
      submit: (e) => { e.preventDefault(); check(this.state.text); },
      giveUp: () => check(''),
      next: () => this.setState({ text: '', result: null, round: round + 1 }),
      more: () => this.setState({ round: round + 1 })
      };
      }
      }
    </script>
  </body>
</html>
