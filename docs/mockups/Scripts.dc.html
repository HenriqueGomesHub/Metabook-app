<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Metabook · Scripts</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@400;500;600;700&amp;family=Stack+Sans+Text:wght@400;500;600&amp;display=swap"
        />
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Noto+Sans+Georgian:wght@500&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
            background: #12110f;
          }
          a {
            color: #eeeae2;
          }
          a:hover {
            color: #ffffff;
          }
          .i {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
          }
          .chip {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            min-width: 44px;
            box-sizing: border-box;
            border-radius: 999px;
            background: #1a1916;
            border: 1px solid #2e2c27;
            color: #eeeae2;
            text-decoration: none;
          }
          .chip:hover {
            background: #22211d;
            color: #ffffff;
          }
          .opt {
            display: flex;
            align-items: center;
            gap: 16px;
            height: 64px;
            padding: 0 22px;
            border-radius: 18px;
            background: #1a1916;
            border: 1px solid #2e2c27;
            color: #eeeae2;
            font:
              400 17px 'Stack Sans Text',
              sans-serif;
            cursor: pointer;
            text-align: left;
            width: 100%;
          }
          .opt:hover:not(:disabled) {
            border-color: #5a574f;
            background: #1f1e1a;
          }
          .opt:disabled {
            cursor: default;
          }
          .opt kbd {
            font:
              500 12px 'Stack Sans Text',
              sans-serif;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid #3a3832;
            border-radius: 6px;
            color: #a39e92;
          }
          .opt.ok {
            border-color: #a3c49a;
            background: rgba(163, 196, 154, 0.1);
          }
          .opt.bad {
            border-color: #d9a35e;
            background: rgba(217, 163, 94, 0.08);
          }
          .opt.dim {
            opacity: 0.4;
          }
          .cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 52px;
            padding: 0 28px;
            border-radius: 999px;
            background: #a3c49a;
            color: #12110f;
            font:
              600 16px 'Stack Sans Text',
              sans-serif;
            border: 0;
            cursor: pointer;
          }
          .cta:hover {
            background: #b4d3ab;
          }
          .ghost {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 52px;
            padding: 0 20px;
            border-radius: 999px;
            background: none;
            border: 1px solid #2e2c27;
            color: #eeeae2;
            font:
              500 15px 'Stack Sans Text',
              sans-serif;
            cursor: pointer;
          }
          .ghost:hover {
            background: #1a1916;
          }
          @keyframes rise {
            from {
              opacity: 0;
              transform: translateY(14px);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          @keyframes pop {
            from {
              opacity: 0;
              transform: scale(0.96);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          .r {
            animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
          }
          .d1 {
            animation-delay: 0.08s;
          }
          .d2 {
            animation-delay: 0.16s;
          }
          .d3 {
            animation-delay: 0.24s;
          }
          .sign {
            animation: pop 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both;
          }
          .cta,
          .chip,
          .opt,
          .ghost {
            transition:
              background-color 0.2s ease,
              color 0.2s ease,
              border-color 0.2s ease,
              transform 0.2s ease,
              opacity 0.35s ease;
          }
          .cta:active,
          .opt:active:not(:disabled),
          .chip:active,
          .ghost:active {
            transform: scale(0.97);
          }
          @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
              animation: none !important;
              transition: none !important;
            }
          }
        </style>
      </helmet>
      <div
        style="
          position: relative;
          min-height: 900px;
          background: #12110f;
          color: #eeeae2;
          font-family: 'Stack Sans Text', system-ui, sans-serif;
          overflow: hidden;
        "
      >
        <svg
          aria-hidden="true"
          style="
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.08;
          "
        >
          <filter id="grain-scripts">
            <feTurbulence
              type="fractalNoise"
              baseFrequency="0.85"
              numOctaves="2"
              stitchTiles="stitch"
            ></feTurbulence>
          </filter>
          <rect width="100%" height="100%" filter="url(#grain-scripts)"></rect>
        </svg>

        <div
          class="r"
          style="
            position: relative;
            display: flex;
            align-items: center;
            gap: 24px;
            padding: 28px 28px 0;
          "
        >
          <a class="chip" href="Main.dc.html" aria-label="Leave session"
            ><svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M6 6l12 12"></path>
              <path d="M18 6 6 18"></path></svg
          ></a>
          <div
            role="img"
            aria-label="Card 14 of 48"
            style="flex: 1; height: 3px; border-radius: 2px; background: #2e2c27"
          >
            <div style="width: 29%; height: 100%; border-radius: 2px; background: #eeeae2"></div>
          </div>
          <span style="font-size: 14px; color: #a39e92; font-variant-numeric: tabular-nums"
            >14 / 48</span
          >
        </div>

        <main
          style="
            position: relative;
            max-width: 720px;
            margin: 0 auto;
            padding: 80px 24px 96px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 44px;
            box-sizing: border-box;
          "
        >
          <figure
            style="
              margin: 0;
              width: 100%;
              display: flex;
              flex-direction: column;
              align-items: center;
              gap: 16px;
            "
          >
            <div
              class="sign"
              role="img"
              aria-label="A street sign written in an unknown script"
              style="
                width: min(560px, 100%);
                padding: 44px 24px;
                box-sizing: border-box;
                border-radius: 14px;
                background: #24452f;
                border: 6px solid #e9e5da;
                box-shadow: 0 0 0 1px #2e2c27;
                text-align: center;
              "
            >
              <span
                lang="ka"
                style="
                  font-family: 'Noto Sans Georgian', sans-serif;
                  font-weight: 500;
                  font-size: 56px;
                  color: #f2efe7;
                  letter-spacing: 0.01em;
                "
                >რუსთაველის გამზ.</span
              >
            </div>
            <figcaption class="r d1" style="font-size: 13px; color: #8a857b">
              Early review · pick one
            </figcaption>
          </figure>

          <div
            class="r d2"
            style="
              width: 100%;
              display: grid;
              grid-template-columns: repeat(auto-fit, minmax(min(100%, 300px), 1fr));
              gap: 12px;
            "
          >
            <sc-for list="{{options}}" as="o" hint-placeholder-count="4">
              <button class="{{o.cls}}" onClick="{{o.pick}}" disabled="{{o.disabled}}">
                <kbd>{{o.key}}</kbd>{{o.name}}<sc-if
                  value="{{o.mark}}"
                  hint-placeholder-val="{{ false }}"
                  ><span style="margin-left: auto; font-size: 13px; color: #a39e92"
                    >{{o.markText}}</span
                  ></sc-if
                >
              </button>
            </sc-for>
          </div>

          <sc-if value="{{revealed}}" hint-placeholder-val="{{ false }}">
            <div class="r" style="width: 100%; display: flex; flex-direction: column; gap: 14px">
              <div
                style="
                  border-radius: 18px;
                  padding: 20px 22px;
                  background: rgba(163, 196, 154, 0.08);
                  border: 1px solid rgba(163, 196, 154, 0.28);
                "
              >
                <div
                  style="
                    display: flex;
                    justify-content: space-between;
                    align-items: center;
                    margin-bottom: 10px;
                  "
                >
                  <span
                    style="
                      display: flex;
                      align-items: center;
                      gap: 8px;
                      font-size: 13px;
                      color: #a3c49a;
                    "
                    ><svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                      <circle cx="11" cy="11" r="6.5"></circle>
                      <path d="m16 16 4 4"></path></svg
                    >{{verdict}}</span
                  >
                  <span style="font-size: 12px; color: #a39e92; font-variant-numeric: tabular-nums"
                    >{{tipCount}}</span
                  >
                </div>
                <p style="margin: 0; font-size: 16px; line-height: 1.55">{{answerTip}}</p>
              </div>
              <sc-if value="{{wrong}}" hint-placeholder-val="{{ false }}">
                <div
                  style="
                    border-radius: 18px;
                    padding: 18px 22px;
                    border: 1px solid rgba(217, 163, 94, 0.35);
                  "
                >
                  <div style="font-size: 13px; color: #d9a35e; margin-bottom: 8px">
                    {{pickedLabel}}
                  </div>
                  <p style="margin: 0; font-size: 15px; line-height: 1.55; color: #d6d1c6">
                    {{pickedTip}}
                  </p>
                </div>
              </sc-if>
              <div style="display: flex; gap: 10px; justify-content: center">
                <button class="cta" onClick="{{next}}">
                  Next<svg
                    class="i"
                    viewBox="0 0 24 24"
                    width="20"
                    height="20"
                    aria-hidden="true"
                    style="stroke-width: 2"
                  >
                    <path d="M5 12h14"></path>
                    <path d="m13 6 6 6-6 6"></path>
                  </svg>
                </button>
                <button class="ghost" onClick="{{more}}">Another tip</button>
              </div>
            </div>
          </sc-if>
        </main>
      </div>
    </x-dc>
    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
      class Component extends DCLogic {
      state = { picked: null, round: 0 };
      renderVals() {
      const answer = 'Georgia';
      const names = ['Armenia', 'Georgia', 'Sri Lanka', 'Ethiopia'];
      const tips = {
      'Georgia': [
      'Georgian is round and loopy and has no capital letters. Many letters dip below or rise above the line.',
      'გამზ. is short for გამზირი, “avenue”. Rustaveli Avenue is the main street of Tbilisi.',
      'The small round letters ი and ა show up constantly. Almost no straight lines anywhere.'
      ],
      'Armenia': [
      'Armenian has more straight vertical strokes, and letters like ու and ն sit flat on the line.',
      'Armenian has capital letters, Georgian does not. A capital at the start of a word points to Armenia.',
      'Surnames ending in -յան (-yan), like Petrosyan, are a strong Armenian hint.'
      ],
      'Sri Lanka': [
      'Sinhala is very round, with loops sitting on top of the letters.',
      'Signs are usually trilingual: Sinhala, Tamil and English.',
      'Sri Lanka drives on the left.'
      ],
      'Ethiopia': [
      'Amharic (Ge’ez script) is built from syllable blocks: a base shape plus small legs or marks, like ሀ ሁ ሂ.',
      'Ethiopia drives on the right, while neighbouring Kenya drives on the left.',
      'Ge’ez letters look blocky and upright, nothing like the curls of Georgian.'
      ]
      };
      const { picked, round } = this.state;
      const revealed = picked !== null;
      const n = tips[answer].length;
      const idx = round % n;
      const options = names.map((name, i) => {
      let cls = 'opt';
      let markText = '';
      if (revealed) {
      if (name === answer) { cls = 'opt ok'; markText = 'Answer'; }
      else if (name === picked) { cls = 'opt bad'; markText = 'Your pick'; }
      else cls = 'opt dim';
      }
      return { name, key: String(i + 1), cls, disabled: revealed, mark: markText !== '', markText, pick: () => this.setState({ picked: name }) };
      });
      const wrong = revealed && picked !== answer;
      return {
      options,
      revealed,
      wrong,
      verdict: wrong ? 'It’s Georgian' : 'Right. Here’s why',
      tipCount: 'Tip ' + (idx + 1) + ' of ' + n,
      answerTip: tips[answer][idx],
      pickedLabel: wrong ? 'Spotting ' + picked : '',
      pickedTip: wrong ? tips[picked][idx] : '',
      next: () => this.setState({ picked: null, round: round + 1 }),
      more: () => this.setState({ round: round + 1 })
      };
      }
      }
    </script>
  </body>
</html>
