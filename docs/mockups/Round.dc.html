<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Metabook · Street View round</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@400;500;600;700&amp;family=Stack+Sans+Text:wght@400;500;600&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
            background: #12110f;
          }
          a {
            color: #eeeae2;
          }
          a:hover {
            color: #ffffff;
          }
          .i {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
          }
          .chip {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            min-width: 44px;
            padding: 0 16px;
            box-sizing: border-box;
            border-radius: 999px;
            background: rgba(18, 17, 15, 0.82);
            border: 1px solid rgba(238, 234, 226, 0.12);
            color: #eeeae2;
            text-decoration: none;
          }
          .chip:hover {
            background: #12110f;
            color: #ffffff;
          }
          .cta {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 52px;
            border-radius: 999px;
            background: #a3c49a;
            color: #12110f;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
          }
          .cta:hover {
            background: #b4d3ab;
            color: #12110f;
          }
          @keyframes rise {
            from {
              opacity: 0;
              transform: translateY(16px);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          @keyframes drop {
            from {
              opacity: 0;
              transform: translateY(-12px);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          @keyframes reveal {
            from {
              opacity: 0;
              transform: scale(1.06);
            }
            to {
              opacity: 1;
              transform: scale(1);
            }
          }
          @keyframes pulse {
            0% {
              transform: scale(0.6);
              opacity: 0.9;
            }
            100% {
              transform: scale(1.8);
              opacity: 0;
            }
          }
          .pano {
            animation: reveal 1.4s cubic-bezier(0.2, 0.7, 0.2, 1) both;
          }
          .top {
            animation: drop 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.5s both;
          }
          .r {
            animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) 0.7s both;
          }
          .ring {
            transform-box: fill-box;
            transform-origin: center;
            animation: pulse 1.8s ease-out infinite;
          }
          .chip,
          .cta {
            transition:
              background-color 0.2s ease,
              color 0.2s ease,
              transform 0.2s ease;
          }
          .cta:active,
          .chip:active {
            transform: scale(0.97);
          }
          @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
              animation: none !important;
              transition: none !important;
            }
          }
        </style>
      </helmet>

            <circle cx="520" cy="452" r="22"></circle>
            <circle cx="548" cy="458" r="16"></circle>
          </g>
          <g>

            <rect x="324" y="716" width="10" height="8" rx="2" fill="#C9883C"></rect>

            <rect x="1006" y="618" width="14" height="10" fill="#26241F"></rect>
          </g>
        </svg>

        <div
          class="top"
          style="
            position: absolute;
            top: 28px;
            left: 28px;
            right: 28px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
          "
        >
          <a class="chip" href="Main.dc.html" aria-label="Leave session" style="padding: 0"
            ><svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M6 6l12 12"></path>
              <path d="M18 6 6 18"></path></svg
          ></a>
          <div class="chip" style="gap: 14px; font-size: 14px">
            <span style="font-family: 'Stack Sans Headline', sans-serif; font-weight: 600">3</span
            ><span style="color: #a39e92">/ 5</span>
            <span style="width: 1px; height: 16px; background: rgba(238, 234, 226, 0.18)"></span>
            <span style="font-variant-numeric: tabular-nums">1:42</span>
          </div>
          <div
            class="chip"
            role="img"
            aria-label="Heading north-east"
            style="padding: 0; width: 44px"
          >
            <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
              <path d="M12 4l3 8h-6z" style="fill: #a3c49a"></path>
              <path d="M12 20l-3-8h6z" style="fill: #6f6b62"></path>
            </svg>
          </div>
        </div>

        <div
          class="r"
          style="
            position: absolute;
            right: 28px;
            bottom: 28px;
            width: min(360px, calc(100% - 56px));
            display: flex;
            flex-direction: column;
            gap: 10px;
          "
        >
          <div

              height: 230px;
              border-radius: 18px;
              overflow: hidden;
              background: #1a1916;
              border: 1px solid rgba(238, 234, 226, 0.12);
            "
          >
            <svg

            >

              </g>

                cx="196"

                r="14"

              <circle
                cx="196"
                cy="62"
                r="5"

              ></circle>
            </svg>
            <button
              aria-label="Enlarge map"
              style="
                position: absolute;
                top: 10px;
                right: 10px;
                width: 36px;
                height: 36px;
                border-radius: 999px;
                border: 1px solid rgba(238, 234, 226, 0.12);
                background: rgba(18, 17, 15, 0.82);
                color: #eeeae2;
                display: flex;
                align-items: center;
                justify-content: center;
                cursor: pointer;
              "
            >
              <svg class="i" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
                <path d="M14 4h6v6"></path>
                <path d="M10 20H4v-6"></path>
                <path d="M20 4l-7 7"></path>
                <path d="M4 20l7-7"></path>
              </svg>
            </button>
          </div>
          <a class="cta" href="Result.dc.html"
            >Guess<kbd
              style="
                font:
                  500 12px 'Stack Sans Text',
                  sans-serif;
                padding: 2px 7px;
                border-radius: 6px;
                background: rgba(18, 17, 15, 0.14);

              >Space</kbd

    <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
      class Component extends DCLogic {
      renderVals() {
      return {};
      }
      }
    </script>
  </body>
</html>
