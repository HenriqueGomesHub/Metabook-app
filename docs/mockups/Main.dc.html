    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@400;500;600;700&amp;family=Stack+Sans+Text:wght@400;500;600&amp;display=swap"

        <style>
          body {
            margin: 0;
            background: #12110f;
          }
          a {
            color: #eeeae2;
          }
          a:hover {
            color: #ffffff;
          }
          .i {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
          }
          .nav {
            position: absolute;
            left: 50%;
            bottom: 28px;
            transform: translateX(-50%);
            display: flex;
            gap: 4px;
            padding: 6px;
            background: #1a1916;
            border: 1px solid #2e2c27;
            border-radius: 999px;
            z-index: 5;
          }
          .nav a {
            width: 48px;
            height: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 999px;
            color: #a39e92;
            text-decoration: none;
          }
          .nav a:hover {
            color: #eeeae2;
            background: #22211d;
          }
          .nav a.on {
            color: #12110f;
            background: #eeeae2;
          }
          .cta {
            display: inline-flex;
            align-items: center;
            gap: 12px;
            padding: 18px 28px;
            border-radius: 999px;
            background: #a3c49a;
            color: #12110f;
            font-weight: 600;
            font-size: 16px;
            text-decoration: none;
          }
          .cta:hover {
            background: #b4d3ab;
            color: #12110f;
          }
          @keyframes rise {
            from {
              opacity: 0;
              transform: translateY(16px);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          @keyframes navIn {
            from {
              opacity: 0;
              transform: translate(-50%, 18px);
            }
            to {
              opacity: 1;
              transform: translate(-50%, 0);
            }
          }
          @keyframes grow {
            from {
              transform: scaleX(0);
            }
            to {
              transform: scaleX(1);
            }
          }
          @keyframes drift {
            from {
              transform: rotate(0deg);
            }
            to {
              transform: rotate(360deg);
            }
          }
          @keyframes pop {
            0% {
              transform: scale(0);
            }
            70% {
              transform: scale(1.25);
            }
            100% {
              transform: scale(1);
            }
          }
          .r {
            animation: rise 0.8s cubic-bezier(0.2, 0.7, 0.2, 1) both;
          }
          .d1 {
            animation-delay: 0.08s;
          }
          .d2 {
            animation-delay: 0.18s;
          }
          .d3 {
            animation-delay: 0.28s;
          }
          .nav {
            animation: navIn 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) 0.35s both;
          }
          .contour {
            animation: drift 240s linear infinite;
            transform-origin: 50% 50%;
          }
          .mix > div {
            transform-origin: left;
            animation: grow 0.9s cubic-bezier(0.2, 0.7, 0.2, 1) both;
          }
          .mix > div:nth-child(1) {
            animation-delay: 0.45s;
          }
          .mix > div:nth-child(2) {
            animation-delay: 0.52s;
          }
          .mix > div:nth-child(3) {
            animation-delay: 0.59s;
          }
          .mix > div:nth-child(4) {
            animation-delay: 0.66s;
          }
          .mix > div:nth-child(5) {
            animation-delay: 0.73s;
          }
          .mix > div:nth-child(6) {
            animation-delay: 0.8s;
          }
          .streak > span {
            animation: pop 0.5s cubic-bezier(0.3, 1.4, 0.5, 1) both;
          }
          .streak > span:nth-child(n + 3) {
            animation-delay: 0.6s;
          }
          .streak > span:last-child {
            animation-delay: 0.9s;
          }
          .nav a,
          .cta {
            transition:
              background-color 0.2s ease,
              color 0.2s ease,
              transform 0.2s ease;
          }
          .cta:hover {
            transform: translateY(-1px);
          }
          .cta:active {
            transform: scale(0.97);
          }
          .cta svg {
            transition: transform 0.25s ease;
          }
          .cta:hover svg {
            transform: translateX(3px);
          }
          @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
              animation: none !important;
              transition: none !important;
            }
          }
        </style>
