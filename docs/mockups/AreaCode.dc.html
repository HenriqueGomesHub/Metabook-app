<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Metabook · Area codes, Brazil</title>
    <script src="./support.js"></script>
  </head>
  <body>
    <x-dc>
      <helmet>
        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link
          rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@400;500;600;700&amp;family=Stack+Sans+Text:wght@400;500;600&amp;display=swap"
        />
        <style>
          body {
            margin: 0;
            background: #12110f;
          }
          a {
            color: #eeeae2;
          }
          a:hover {
            color: #ffffff;
          }
          .i {
            fill: none;
            stroke: currentColor;
            stroke-width: 1.6;
            stroke-linecap: round;
            stroke-linejoin: round;
          }
          .chip {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 44px;
            min-width: 44px;
            box-sizing: border-box;
            border-radius: 999px;
            background: #1a1916;
            border: 1px solid #2e2c27;
            color: #eeeae2;
            text-decoration: none;
          }
          .chip:hover {
            background: #22211d;
            color: #ffffff;
          }
          .st {
            fill: #1e1d19;
            stroke: #55524a;
            stroke-width: 1;
            stroke-linejoin: round;
            cursor: pointer;
            transition:
              fill 0.2s ease,
              opacity 0.4s ease;
          }
          .st:hover {
            fill: #33312b;
          }
          .st.lock {
            cursor: default;
          }
          .st.lock:hover {
            fill: #1e1d19;
          }
          .st.ans,
          .st.ans:hover {
            fill: #a3c49a;
            stroke: #a3c49a;
          }
          .st.pick,
          .st.pick:hover {
            fill: #5a4527;
            stroke: #d9a35e;
          }
          .st.grp,
          .st.grp:hover {
            fill: #33402f;
          }
          .st.dim,
          .st.dim:hover {
            fill: #171613;
            stroke: #3a3832;
          }
          .lb {
            font:
              600 11px 'Stack Sans Text',
              sans-serif;
            fill: #a39e92;
            pointer-events: none;
            text-anchor: middle;
            letter-spacing: 0.03em;
          }
          .lb.on {
            fill: #12110f;
          }
          .lead {
            stroke: #4a473f;
            stroke-width: 1;
            fill: none;
          }
          .cta {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            height: 52px;
            padding: 0 28px;
            border-radius: 999px;
            background: #a3c49a;
            color: #12110f;
            font:
              600 16px 'Stack Sans Text',
              sans-serif;
            border: 0;
            cursor: pointer;
            transition:
              background-color 0.2s ease,
              transform 0.2s ease;
          }
          .cta:hover {
            background: #b4d3ab;
          }
          .cta:active {
            transform: scale(0.97);
          }
          .ghost {
            background: none;
            border: 0;
            padding: 4px 0;
            color: #a39e92;
            font:
              500 13px 'Stack Sans Text',
              sans-serif;
            cursor: pointer;
            text-decoration: underline;
            text-underline-offset: 3px;
          }
          .ghost:hover {
            color: #eeeae2;
          }
          .medal {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            height: 34px;
            padding: 0 14px 0 8px;
            border-radius: 999px;
            border: 1px solid #2e2c27;
            font-size: 13px;
          }
          @keyframes rise {
            from {
              opacity: 0;
              transform: translateY(14px);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          @keyframes codeIn {
            from {
              opacity: 0;
              transform: translateY(20px);
              filter: blur(6px);
            }
            to {
              opacity: 1;
              transform: none;
              filter: none;
            }
          }
          @keyframes mapIn {
            from {
              opacity: 0;
              transform: scale(0.97);
            }
            to {
              opacity: 1;
              transform: none;
            }
          }
          @keyframes draw {
            from {
              stroke-dashoffset: 600;
            }
            to {
              stroke-dashoffset: 0;
            }
          }
          @keyframes pop {
            0% {
              transform: scale(0);
            }
            70% {
              transform: scale(1.35);
            }
            100% {
              transform: scale(1);
            }
          }
          .r {
            animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.2, 1) both;
          }
          .d1 {
            animation-delay: 0.1s;
          }
          .d2 {
            animation-delay: 0.2s;
          }
          .code {
            animation: codeIn 0.6s cubic-bezier(0.2, 0.7, 0.2, 1) both;
          }
          .map {
            animation: mapIn 1s cubic-bezier(0.2, 0.7, 0.2, 1) 0.15s both;
            transform-origin: center;
          }
          .trail {
            stroke-dasharray: 600;
            animation: draw 0.9s cubic-bezier(0.4, 0, 0.2, 1) 0.15s both;
          }
          .pin {
            transform-box: fill-box;
            transform-origin: center;
            animation: pop 0.45s cubic-bezier(0.3, 1.4, 0.5, 1) both;
          }
          .pin.late {
            animation-delay: 0.9s;
          }
          @media (prefers-reduced-motion: reduce) {
            *,
            *::before,
            *::after {
              animation: none !important;
              transition: none !important;
            }
          }
        </style>
      </helmet>
      <div
        style="
          position: relative;
          min-height: 900px;
          background: #12110f;
          color: #eeeae2;
          font-family: 'Stack Sans Text', system-ui, sans-serif;
          overflow: hidden;
        "
      >
        <svg
          aria-hidden="true"
          style="
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            opacity: 0.08;
          "
        >
          <filter id="grain-ddd">
            <feTurbulence
              type="fractalNoise"
              baseFrequency="0.85"
              numOctaves="2"
              stitchTiles="stitch"
            ></feTurbulence>
          </filter>
          <rect width="100%" height="100%" filter="url(#grain-ddd)"></rect>
        </svg>

        <div
          class="r"
          style="
            position: relative;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 24px;
            padding: 28px 28px 0;
            flex-wrap: wrap;
          "
        >
          <a class="chip" href="Games.dc.html" aria-label="Back to mini-games"
            ><svg class="i" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
              <path d="M6 6l12 12"></path>
              <path d="M18 6 6 18"></path></svg
          ></a>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 14px;
              flex-wrap: wrap;
              justify-content: center;
            "
          >
            <span
              style="display: flex; align-items: center; gap: 10px; font-size: 14px; color: #a39e92"
              ><svg class="i" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
                <path
                  d="M5 4h4l2 5-2.5 1.5a11 11 0 0 0 5 5L15 13l5 2v4a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2"
                ></path></svg
              >Brazil · Area codes</span
            >
            <span class="medal" title="Silver at 50%"
              ><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
                <path
                  d="M8 2.5 10.5 9M16 2.5 13.5 9"
                  style="fill: none; stroke: #6f6b62; stroke-width: 2; stroke-linecap: round"
                ></path>
                <circle cx="12" cy="15" r="6.5" style="fill: #b9805a"></circle>
                <circle
                  cx="12"
                  cy="15"
                  r="4"
                  style="fill: none; stroke: #12110f; stroke-opacity: 0.35; stroke-width: 1.2"
                ></circle></svg
              >Bronze · 31%</span
            >
          </div>
          <div
            style="
              display: flex;
              align-items: center;
              gap: 16px;
              font-size: 14px;
              font-variant-numeric: tabular-nums;
            "
          >
            <span style="color: #a39e92">{{roundLabel}}</span
            ><span style="font-weight: 600">{{totalLabel}}</span>
          </div>
        </div>

        <main
          style="
            position: relative;
            max-width: 1280px;
            margin: 0 auto;
            padding: 32px 40px 48px;
            display: flex;
            flex-wrap: wrap;
            gap: 56px;
            align-items: center;
            justify-content: center;
            box-sizing: border-box;
          "
        >
          <section
            style="
              flex: 1 1 340px;
              min-width: 0;
              max-width: 440px;
              display: flex;
              flex-direction: column;
              gap: 28px;
            "
          >
            <div class="r d1">
              <p style="margin: 0 0 4px; font-size: 14px; color: #a39e92">Which state uses</p>
              <sc-for list="{{codeNow}}" as="c" hint-placeholder-count="1"
                ><div
                  class="code"
                  style="
                    font-family: 'Stack Sans Headline', sans-serif;
                    font-size: 168px;
                    font-weight: 600;
                    letter-spacing: -0.06em;
                    line-height: 0.9;
                  "
                >
                  {{c.code}}
                </div></sc-for
              >
              <p style="margin: 12px 0 0; font-size: 15px; color: #a39e92">
                Click the state. Closer is better.
              </p>
            </div>

            <sc-if value="{{revealed}}" hint-placeholder-val="{{ false }}">
              <div class="r" style="display: flex; flex-direction: column; gap: 16px">
                <div>
                  <p style="margin: 0 0 4px; font-size: 14px; color: {{verdictColor}}">
                    {{verdict}}
                  </p>
                  <h2
                    style="
                      margin: 0;
                      font-family: 'Stack Sans Headline', sans-serif;
                      font-size: 36px;
                      font-weight: 600;
                      letter-spacing: -0.02em;
                    "
                  >
                    {{answerName}}
                  </h2>
                </div>
                <div style="display: flex; gap: 32px">
                  <div>
                    <div
                      style="
                        font-family: 'Stack Sans Headline', sans-serif;
                        font-size: 28px;
                        font-weight: 600;
                        font-variant-numeric: tabular-nums;
                      "
                    >
                      {{km}}
                    </div>
                    <div style="font-size: 13px; color: #a39e92">distance</div>
                  </div>
                  <div>
                    <div
                      style="
                        font-family: 'Stack Sans Headline', sans-serif;
                        font-size: 28px;
                        font-weight: 600;
                        font-variant-numeric: tabular-nums;
                      "
                    >
                      {{pts}}
                    </div>
                    <div style="font-size: 13px; color: #a39e92">points</div>
                  </div>
                </div>
                <div
                  style="
                    border-radius: 18px;
                    padding: 18px 20px;
                    background: rgba(163, 196, 154, 0.08);
                    border: 1px solid rgba(163, 196, 154, 0.28);
                  "
                >
                  <div
                    style="
                      display: flex;
                      justify-content: space-between;
                      align-items: center;
                      margin-bottom: 8px;
                    "
                  >
                    <span style="font-size: 13px; color: #a3c49a">The pattern</span
                    ><span
                      style="font-size: 12px; color: #a39e92; font-variant-numeric: tabular-nums"
                      >{{tipCount}}</span
                    >
                  </div>
                  <p style="margin: 0 0 10px; font-size: 15px; line-height: 1.55">{{tip}}</p>
                  <button class="ghost" onClick="{{more}}">Another tip</button>
                </div>
                <div>
                  <button class="cta" onClick="{{next}}">
                    Next code<svg
                      class="i"
                      viewBox="0 0 24 24"
                      width="20"
                      height="20"
                      aria-hidden="true"
                      style="stroke-width: 2"
                    >
                      <path d="M5 12h14"></path>
                      <path d="m13 6 6 6-6 6"></path>
                    </svg>
                  </button>
                </div>
              </div>
            </sc-if>
          </section>

          <div
            class="r d2"
            style="flex: 0 1 640px; min-width: 0; display: flex; flex-direction: column; gap: 10px"
          >
            <div
              aria-live="polite"
              style="height: 24px; font-size: 15px; text-align: center; color: {{hoverColor}}"
            >
              {{hoverName}}
            </div>
            <svg
              class="map"
              role="group"
              aria-label="Map of Brazil with state borders"
              viewBox="0 0 640 580"
              style="width: 100%; height: auto; display: block"
            >
              <sc-for list="{{states}}" as="s" hint-placeholder-count="27">
                <path
                  class="{{s.cls}}"
                  d="{{s.d}}"
                  onClick="{{s.pick}}"
                  onMouseEnter="{{s.enter}}"
                  onMouseLeave="{{leave}}"
                >
                  <title>{{s.name}}</title>
                </path>
              </sc-for>
              <sc-for list="{{leads}}" as="l" hint-placeholder-count="8">
                <path class="lead" d="{{l.d}}"></path>
              </sc-for>
              <sc-for list="{{labels}}" as="t" hint-placeholder-count="27">
                <text class="{{t.cls}}" x="{{t.x}}" y="{{t.y}}" style="{{t.style}}">{{t.a}}</text>
              </sc-for>
              <sc-if value="{{showTrail}}" hint-placeholder-val="{{ false }}">
                <path
                  class="trail"
                  d="{{trail}}"
                  style="
                    fill: none;
                    stroke: #eeeae2;
                    stroke-width: 1.6;
                    stroke-dasharray: 600;
                    stroke-linecap: round;
                  "
                ></path>
                <circle
                  class="pin"
                  cx="{{pickX}}"
                  cy="{{pickY}}"
                  r="5"
                  style="fill: #eeeae2; stroke: #12110f; stroke-width: 2"
                ></circle>
              </sc-if>
              <sc-if value="{{revealed}}" hint-placeholder-val="{{ false }}">
                <circle
                  class="pin late"
                  cx="{{ansX}}"
                  cy="{{ansY}}"
                  r="6"
                  style="fill: #12110f; stroke: #eeeae2; stroke-width: 2"
                ></circle>
              </sc-if>
            </svg>
          </div>
        </main>
      </div>
    </x-dc>
