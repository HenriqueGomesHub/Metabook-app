<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12110F" />
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Stack+Sans+Headline:wght@400;500;600;700&family=Stack+Sans+Text:wght@400;500;600&display=swap"
    />
    <title>Metabook</title>
    <style>
      /* shown until the app's first render replaces #root's content */
      html,
      body {
        margin: 0;
        background: #12110f;
      }
      .boot {
        display: grid;
        place-items: center;
        gap: 14px;
        min-height: 100vh;
        align-content: center;
        color: #a39e92;
        font: 15px system-ui, sans-serif;
      }
      .boot-mark {
        width: 28px;
        height: 28px;
        border: 2px solid #3a3832;
        border-top-color: #a3c49a;
        border-radius: 50%;
        animation: boot-spin 0.9s linear infinite;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .boot-mark {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot" role="status" aria-live="polite">
        <span class="boot-mark" aria-hidden="true"></span>
        Loading Metabook…
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
